<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0d18"/>
    <stop offset="100%" stop-color="#141830"/>
  </linearGradient>
  <linearGradient id="beam" x1="1" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#ff9820" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ff6010" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFB830"/>
    <stop offset="100%" stop-color="#FF8C20"/>
  </linearGradient>
  <radialGradient id="glow1" cx="75%" cy="25%" r="40%">
    <stop offset="0%" stop-color="#ff9820" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#ff9820" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="15%" cy="80%" r="30%">
    <stop offset="0%" stop-color="#6080e0" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#6080e0" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
</defs>

<!-- Background -->
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#glow1)"/>
<rect width="1200" height="630" fill="url(#glow2)"/>

<!-- Grid -->
<g stroke="#1e2840" stroke-width="1" opacity="0.6">
  <line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/>
  <line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/>
  <line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
  <line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/>
  <line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
  <line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/>
  <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
  <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
  <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
</g>

<!-- Laser beam -->
<polygon points="1060,0 1200,0 380,630 200,630" fill="url(#beam)"/>
<polygon points="1000,0 1040,0 400,630 360,630" fill="#ff9820" opacity="0.08"/>

<!-- Decorative circles right -->
<circle cx="980" cy="180" r="180" fill="none" stroke="#ff9820" stroke-width="1" opacity="0.2"/>
<circle cx="980" cy="180" r="130" fill="none" stroke="#ff9820" stroke-width="1" opacity="0.15"/>
<circle cx="980" cy="180" r="80" fill="none" stroke="#FFB830" stroke-width="2" opacity="0.3"/>
<circle cx="980" cy="180" r="40" fill="#ff9820" opacity="0.12"/>

<!-- Laser dots -->
<circle cx="850" cy="320" r="3" fill="#FFB830" opacity="0.9"/>
<circle cx="920" cy="280" r="2" fill="#6080e0" opacity="0.8"/>
<circle cx="780" cy="400" r="4" fill="#FFB830" opacity="0.6"/>
<circle cx="1050" cy="350" r="2" fill="#6080e0" opacity="0.7"/>
<circle cx="1100" cy="200" r="3" fill="#FFB830" opacity="0.8"/>
<circle cx="700" cy="500" r="2" fill="#6080e0" opacity="0.6"/>
<circle cx="1150" cy="480" r="3" fill="#FFB830" opacity="0.5"/>

<!-- Brand INGLY -->
<text x="80" y="250" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="white" letter-spacing="-2">INGLY</text>
<text x="80" y="350" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="url(#gold)" letter-spacing="-2">DESIGN</text>

<!-- Separator line -->
<rect x="80" y="372" width="520" height="4" fill="url(#gold)" rx="2"/>

<!-- Tagline -->
<text x="80" y="415" font-family="Arial, sans-serif" font-size="26" fill="#b4b8d8" letter-spacing="0.5">Incisione Laser · Stampa UV · DTF · 3D Printing</text>
<text x="80" y="455" font-family="Arial, sans-serif" font-size="20" fill="#7880a8" letter-spacing="1">✦ Made in Italy · Cesena, Emilia-Romagna</text>

<!-- Stars rating -->
<text x="80" y="510" font-family="Arial, sans-serif" font-size="22" fill="#FFB830">★★★★★</text>
<text x="200" y="510" font-family="Arial, sans-serif" font-size="18" fill="#8890b0"> 4,9 · 640+ clienti soddisfatti</text>

<!-- Domain -->
<text x="80" y="580" font-family="Arial, sans-serif" font-size="16" fill="#5060a0" letter-spacing="0.5">www.inglydesign.it</text>

<!-- Corner accent -->
<polygon points="1200,0 1200,120 1080,0" fill="#ff9820" opacity="0.15"/>
</svg>